name: Android Wheels & Release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if release exists'
        required: false
        default: false
        type: boolean
      target_version:
        description: 'pydantic-core version to build, e.g. 2.46.5 (leave blank to use TARGET_VERSION below, or latest on PyPI if that is also blank)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 1 * *' # Run monthly on the 1st

env:
  PACKAGE_NAME: pydantic-core
  NDK_VERSION: '25.2.9519653' # NDK r25b (Stable LTS)
  ANDROID_API: 24
  # 👇 Easiest place to pin a version: set e.g. '2.46.5' and push.
  # Leave as '' to always build whatever is currently latest on PyPI.
  # A value entered in the "target_version" input above (manual runs only)
  # takes priority over this default.
  TARGET_VERSION: ''
  # Candidate Python versions to build for. The check-version job filters
  # this list down at runtime to whichever of these the resolved
  # pydantic-core release actually supports (see "Resolve Supported Python
  # Versions" step), so add new Python versions here only.
  ALL_PYTHON_VERSIONS: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]'

permissions:
  contents: write 

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pypi.outputs.version }}
      should_build: ${{ steps.check_release.outputs.should_build }}
      python_versions: ${{ steps.supported_pythons.outputs.python_versions }}
    steps:
      - uses: actions/checkout@v4
      
      - id: pypi
        name: Resolve Target Version
        env:
          INPUT_VERSION: ${{ inputs.target_version }}
        run: |
          # Priority: workflow_dispatch input > TARGET_VERSION env default > latest on PyPI
          VER="$INPUT_VERSION"
          if [ -z "$VER" ]; then
            VER="${{ env.TARGET_VERSION }}"
          fi

          if [ -z "$VER" ]; then
            echo "No version pinned, resolving latest release from PyPI..."
            VER=$(curl -s https://pypi.org/pypi/${{ env.PACKAGE_NAME }}/json | python3 -c "import sys, json; print(json.load(sys.stdin)['info']['version'])")
            echo "Latest PyPI version: $VER"
          else
            echo "Using pinned version: $VER"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${{ env.PACKAGE_NAME }}/$VER/json")
            if [ "$STATUS" != "200" ]; then
              echo "::error::Version $VER not found on PyPI for ${{ env.PACKAGE_NAME }} (HTTP $STATUS)"
              exit 1
            fi
          fi

          echo "version=$VER" >> $GITHUB_OUTPUT

      - id: supported_pythons
        name: Resolve Supported Python Versions
        env:
          PACKAGE_VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          # pydantic-core periodically drops support for older Python
          # versions (e.g. 2.48.0 requires >=3.10, dropping 3.9 which
          # 2.46.5 still supported). Building from source for a Python
          # version pydantic-core no longer supports just fails the job,
          # so we ask PyPI what this specific pinned version's
          # requires_python floor is, and only keep matrix entries that
          # meet it. This is a simple ">=X.Y" floor check, matching the
          # format pydantic-core has always used. If requires_python is
          # missing or in a format we don't recognize, we fail OPEN
          # (keep every configured version) rather than silently skipping
          # everything.
          REQUIRES_PYTHON=$(curl -s "https://pypi.org/pypi/${{ env.PACKAGE_NAME }}/$PACKAGE_VERSION/json" | python3 -c "import sys, json; print(json.load(sys.stdin)['info'].get('requires_python') or '')")
          echo "${{ env.PACKAGE_NAME }} $PACKAGE_VERSION requires_python: '${REQUIRES_PYTHON:-<none specified>}'"

          export REQUIRES_PYTHON
          SUPPORTED=$(python3 -c "import json, os, re
          all_versions = json.loads(os.environ['ALL_PYTHON_VERSIONS'])
          rp = os.environ.get('REQUIRES_PYTHON', '').strip()
          m = re.search(r'>=\s*(\d+)\.(\d+)', rp)
          floor = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          supported = [v for v in all_versions if tuple(int(x) for x in v.split('.')) >= floor]
          print(json.dumps(supported))
          ")

          export SUPPORTED
          SKIPPED=$(python3 -c "import json, os
          all_versions = json.loads(os.environ['ALL_PYTHON_VERSIONS'])
          supported = json.loads(os.environ['SUPPORTED'])
          skipped = [v for v in all_versions if v not in supported]
          print(', '.join(skipped) if skipped else 'none')
          ")

          echo "Building for: $SUPPORTED"
          echo "Skipping unsupported Python versions: $SKIPPED"

          if [ "$SUPPORTED" == "[]" ]; then
            echo "::error::None of the configured Python versions (${{ env.ALL_PYTHON_VERSIONS }}) satisfy requires_python '$REQUIRES_PYTHON' for ${{ env.PACKAGE_NAME }} $PACKAGE_VERSION"
            exit 1
          fi

          echo "python_versions=$SUPPORTED" >> $GITHUB_OUTPUT

      - id: check_release
        name: Check if Release Exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_build }}
        run: |
          VER="${{ steps.pypi.outputs.version }}"
          TAG="v$VER"
          
          if [ "$FORCE" == "true" ]; then
            echo "Force build enabled."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG not found. Starting build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.arch }} (Py${{ matrix.python-version }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.check-version.outputs.python_versions) }}
        arch: ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust & Targets
        run: |
          pip install maturin
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r25b
        run: |
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build Wheel (Termux Fix)
        id: build_step
        run: |
          set -e
          source "$HOME/.cargo/env"

          # --- Environment Configuration ---
          PY_VER="${{ matrix.python-version }}"
          PKG_VER="${{ needs.check-version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          export ANDROID_API_LEVEL=${{ env.ANDROID_API }}
          
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export PATH="$NDK_BIN:$PATH"

          # --- Architecture Config ---
          if [ "$ARCH" == "arm64-v8a" ]; then
             RUST_TARGET="aarch64-linux-android"
             CC_TARGET="aarch64-linux-android${ANDROID_API}"
             NDK_LIB_ARCH="aarch64-linux-android"
             PLAT_TAG="linux_aarch64"
             ANDROID_ABI_TAG="arm64_v8a"
          elif [ "$ARCH" == "armeabi-v7a" ]; then
             RUST_TARGET="armv7-linux-androideabi"
             CC_TARGET="armv7a-linux-androideabi${ANDROID_API}"
             NDK_LIB_ARCH="arm-linux-androideabi"
             PLAT_TAG="linux_armv7l"
             ANDROID_ABI_TAG="armeabi_v7a"
          elif [ "$ARCH" == "x86" ]; then
             RUST_TARGET="i686-linux-android"
             CC_TARGET="i686-linux-android${ANDROID_API}"
             NDK_LIB_ARCH="i686-linux-android"
             PLAT_TAG="linux_i686"
             ANDROID_ABI_TAG="x86"
          elif [ "$ARCH" == "x86_64" ]; then
             RUST_TARGET="x86_64-linux-android"
             CC_TARGET="x86_64-linux-android${ANDROID_API}"
             NDK_LIB_ARCH="x86_64-linux-android"
             PLAT_TAG="linux_x86_64"
             ANDROID_ABI_TAG="x86_64"
          fi

          # --- Wheel Tag Strategy ---
          # Python 3.13 is the first CPython release with official Android
          # support (PEP 738: https://peps.python.org/pep-0738/). Some Termux
          # builds on 3.13+ self-identify as "Android" rather than generic
          # "Linux", which makes pip stop treating a plain `linux_<arch>`
          # wheel as installable (see project issue #4). Wheel filenames may
          # carry multiple dot-separated platform tags (this is how manylinux
          # wheels already work), and pip installs if ANY of them match, so
          # for 3.13+ we tag with both the legacy tag and the PEP 738 tag.
          # This is additive and never removes the legacy tag, so it can't
          # regress installs that currently work.
          # Python 3.9-3.12 predate PEP 738 entirely, so only the legacy tag
          # is used there.
          PY_MAJOR="${PY_VER%%.*}"
          PY_MINOR="${PY_VER##*.}"
          FINAL_PLAT_TAG="$PLAT_TAG"
          if [ "$PY_MAJOR" -eq 3 ] && [ "$PY_MINOR" -ge 13 ]; then
            FINAL_PLAT_TAG="${PLAT_TAG}.android_${ANDROID_API}_${ANDROID_ABI_TAG}"
          fi
          echo "Wheel platform tag: $FINAL_PLAT_TAG"
          
          # --- Configure Linker ---
          CLANG_WRAPPER="${CC_TARGET}-clang"
          LINKER_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          if [ -f "$NDK_BIN/$CLANG_WRAPPER" ]; then
             export $LINKER_VAR="$NDK_BIN/$CLANG_WRAPPER"
          else
             export $LINKER_VAR="$NDK_BIN/clang"
          fi

          # --- Mocking Python (Termux Strategy) ---
          MOCK_DIR="$(pwd)/mock_libs"
          mkdir -p "$MOCK_DIR"

          # 1. Create fake libpython with SONAME
          "$NDK_BIN/clang" --target=$CC_TARGET -shared \
            -Wl,-soname,libpython$PY_VER.so \
            -o "$MOCK_DIR/libpython$PY_VER.so" -xc /dev/null

          # 2. Copy real libdl.so
          LIBDL_PATH=$(find "$NDK_SYSROOT" -name "libdl.so" | grep "$NDK_LIB_ARCH" | head -n 1)
          cp "$LIBDL_PATH" "$MOCK_DIR/"
          
          # 3. Create Sysconfig File (BUT DO NOT EXPORT VAR YET)
          SYSCONFIG_NAME="_sysconfigdata__linux_${RUST_TARGET}"
          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" <<EOF
          build_time_vars = {
              'abiflags': '',
              'ABIFLAGS': '',
              'SO': '.so', 'SOABI': 'cpython-$PY_VER', 'EXT_SUFFIX': '.so',
              'LIBDIR': '$MOCK_DIR', 
              'LDLIBRARY': 'libpython$PY_VER.so',
              'Py_ENABLE_SHARED': 1, 
              'CC': 'clang', 'CXX': 'clang++',
              'VERSION': '$PY_VER', 'LDSHARED': 'clang -shared',
              'LDFLAGS': '-L$MOCK_DIR', 'CCSHARED': '-fPIC', 'GNULD': 'yes',
              'Py_DEBUG': 0, 'WITH_PYMALLOC': 1,
          }
          EOF

          # --- Download Source Code (CLEAN ENVIRONMENT) ---
          # Run pip BEFORE exporting cross-compilation env vars
          mkdir -p build_src && cd build_src
          echo "Downloading source for $PKG_VER..."
          pip download "${{ env.PACKAGE_NAME }}==$PKG_VER" --no-binary :all: --no-deps
          tar -xzf pydantic?core-*.tar.gz
          cd pydantic?core-*/

          # --- APPLY CROSS-COMPILATION ENV VARS NOW ---
          export PYO3_CROSS_LIB_DIR="$MOCK_DIR"
          export PYTHONPATH="$MOCK_DIR:$PYTHONPATH"
          export PYO3_CROSS_PYTHON_VERSION="$PY_VER"
          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONFIG_NAME"
          
          # --- Rust Flags ---
          # 1. --no-as-needed: Forces recording of libpython dependency
          # 2. -rpath: Hardcodes Termux library path
          RUSTFLAGS_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"
          export $RUSTFLAGS_VAR="\
          -L native=$MOCK_DIR \
          -C link-arg=--target=$CC_TARGET \
          -C link-arg=-Wl,--no-as-needed \
          -C link-arg=-lpython$PY_VER \
          -C link-arg=-Wl,--as-needed \
          -C link-arg=-Wl,--unresolved-symbols=ignore-all \
          -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"

          echo "Starting Maturin Build..."
          maturin build --release --strip --target "$RUST_TARGET" --interpreter python$PY_VER --skip-auditwheel

          # --- Rename Output ---
          cd target/wheels
          OLD=$(ls *.whl)
          NEW=$(echo "$OLD" | sed -E "s/(-[^-]+)\.whl$/-${FINAL_PLAT_TAG}.whl/")
          mv "$OLD" "$NEW"
          
          echo "WHEEL_PATH=$(pwd)/$NEW" >> $GITHUB_OUTPUT

      - name: Upload Temporary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}-${{ matrix.arch }}
          path: ${{ steps.build_step.outputs.WHEEL_PATH }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: ${{ env.PACKAGE_NAME }} v${{ needs.check-version.outputs.version }}
          body: |
            ### Automated Android Build 🤖
            
            **Package:** `${{ env.PACKAGE_NAME }}`
            **Version:** `${{ needs.check-version.outputs.version }}`
            
            **Platform Support:**
            - **OS:** Android (Termux)
            - **Archs:** `aarch64`, `armv7`, `x86`, `x86_64`
            - **Python:** ${{ join(fromJson(needs.check-version.outputs.python_versions), ', ') }}
            - **Wheel tags:** Python 3.13+ wheels carry a dual tag (`linux_<arch>` + `android_${{ env.ANDROID_API }}_<abi>`, PEP 738) so pip installs correctly whether your Termux build self-identifies as Linux or Android. Python 3.9-3.12 wheels use the legacy `linux_<arch>` tag only.
            
            **Installation:**
            ```bash
            pip install pydantic_core-*.whl
            ```
            
            **Technical Details:**
            - Built with NDK r25b (API 24)
            - Includes `RPATH` fix for Termux library location
            - Linked with `--no-as-needed` to ensure `libpython` loading
            - Dual PEP 738 Android wheel tags on Python 3.13+ (see [issue #4](https://github.com/${{ github.repository }}/issues/4))
          files: wheels/*.whl
          make_latest: true
